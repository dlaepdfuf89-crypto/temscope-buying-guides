# TEMSCOPE registration-safe static site; source is dedicated to TEMSCOPE only.
# No affiliate URLs are published until the exact new host is registered in Coupang Partners.
services:
  - type: web
    runtime: static
    name: temscope-buying-guides
    repo: https://github.com/dlaepdfuf89-crypto/temscope-buying-guides
    branch: main
    buildCommand: echo TEMSCOPE-static-site-ready
    staticPublishPath: .
    autoDeployTrigger: 'off'
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
